server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: lms-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerlabs_lms}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:400MB}
      max-request-size: ${MAX_UPLOAD_SIZE:400MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  mail:
    from: ${MAIL_FROM:noreply@careerlabs.com}
  secure-video:
    dir: ${SECURE_VIDEO_DIR:secure-video}
  s3:
    # Leave S3_BUCKET empty (the default) to keep using local disk storage.
    # Set S3_BUCKET=my-bucket to switch to S3 automatically — no code change needed.
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-south-1}
    prefix: ${S3_KEY_PREFIX:recorded-sessions}
  google-drive:
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  playback-token:
    expiration-seconds: ${PLAYBACK_TOKEN_EXPIRATION_SECONDS:600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3040}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  purge-sample-data: ${PURGE_SAMPLE_DATA:false}


logging:
  level:
    com.careerlabs.lms.api: ${LOG_LEVEL:INFO}
