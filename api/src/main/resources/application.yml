server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: lms-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@careerlabs.com}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}
  purge-sample-data: ${PURGE_SAMPLE_DATA:true}


logging:
  level:
    com.careerlabs.lms.api: ${LOG_LEVEL:INFO}
