server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: lms-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Raised from the original 10MB so recorded-session video uploads fit;
      # FileStorageService still separately caps PDF/DOC uploads at 10MB in code.
      max-file-size: ${MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${MAX_UPLOAD_SIZE:2GB}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  secure-video:
    dir: ${SECURE_VIDEO_DIR:secure-video}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  playback-token:
    expiration-seconds: ${PLAYBACK_TOKEN_EXPIRATION_SECONDS:600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@careerlabs.com}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}
  purge-sample-data: ${PURGE_SAMPLE_DATA:false}


logging:
  level:
    com.careerlabs.lms.api: ${LOG_LEVEL:INFO}
